[package]
name = "fyshell"
version = "0.1.0"
edition = "2021"

[lib]
name = "fyshell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 框架
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"

# 异步运行时
tokio = { version = "1", features = ["full"] }

# SSH/SFTP（ring 加密后端：Windows 下免 CMake/NASM 依赖）
russh = { version = "0.63", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "2"

# 持久化（凭据存 Rust 侧 SQLite）
rusqlite = { version = "0.32", features = ["bundled"] }

# MySQL（P1 第二期）
mysql_async = "0.34"

# 通用
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
# 本地终端 PTY（wezterm 系：Windows ConPTY / macOS/Linux 原生 PTY）
portable-pty = "0.8"

# 串口终端（serial-unix/serial-windows 按平台自动后端）
serialport = { version = "4.10.1", default-features = false }

# 凭据保险库（主密码保护已存连接密码）：AEAD + 密钥派生（RustCrypto 纯 Rust）
chacha20poly1305 = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"

# IPC 类型绑定自动生成（bindings.ts 编译期生成，类型权威来源）
# specta 版本须与 tauri-specta 精确匹配（rc 阶段官方要求用 "=" 锁定）；
# serde_json feature：为 serde_json::Value 提供 Type 实现（RedisExecResult.value）
specta = { version = "=2.0.0-rc.25", features = ["serde_json"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
redis = { version = "1.7.0", features = ["tokio-comp"] }

# 终端 ZMODEM 传输（rz/sz 命令）：调用方驱动状态机，I/O 全部由本应用接管
zmodem2 = "0.7"

[profile.release]
strip = true
lto = true
